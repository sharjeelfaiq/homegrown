<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Waveform, matching WaveRibbon. Two colours only: bg-base #14151a and
       accent-2 #4dd4e8, the token that means "audio". No filters or glows.
       Four bars at 4px, not five at 2.6px: thinner bars mush at a 16px tab.
       NB: no double hyphens anywhere in this comment. XML forbids them, and an
       unparseable favicon fails silently to whatever the browser cached. -->
  <rect width="32" height="32" rx="7" fill="#14151a" />
  <g fill="#4dd4e8">
    <rect x="5" y="12" width="4" height="8" rx="2" />
    <rect x="12" y="5" width="4" height="22" rx="2" />
    <rect x="19" y="9" width="4" height="14" rx="2" />
    <rect x="26" y="13" width="4" height="6" rx="2" />
  </g>
</svg>
