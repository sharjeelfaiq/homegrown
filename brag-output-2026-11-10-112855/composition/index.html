<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d0e13;
        --ink: #f5f6f8;
        --font-display: "Archivo Variable", "Archivo Black", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="clone" data-composition-id="clone" data-composition-src="compositions/clone.html" data-start="11" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="script" data-composition-id="script" data-composition-src="compositions/script.html" data-start="20" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="render" data-composition-id="render" data-composition-src="compositions/render.html" data-start="27" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="hear" data-composition-id="hear" data-composition-src="compositions/hear.html" data-start="34" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="voices" data-composition-id="voices" data-composition-src="compositions/voices.html" data-start="43" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="yours" data-composition-id="yours" data-composition-src="compositions/yours.html" data-start="50" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="55.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music bed: darkened, ducked under narration (~0.13) and lowest under the cloned voice (~0.06). -->
      <audio
        id="music"
        class="clip"
        data-start="0"
        data-duration="60"
        data-track-index="10"
        data-volume="1"
        data-fade-in="1.2"
        data-fade-out="2"
        data-audio-group="music"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;lowpass&quot;,&quot;id&quot;:&quot;dark&quot;,&quot;label&quot;:&quot;Darken the bed&quot;,&quot;params&quot;:{&quot;frequency&quot;:3200}}]}"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.32},{&quot;t&quot;:0.6,&quot;v&quot;:0.32},{&quot;t&quot;:0.85,&quot;v&quot;:0.13},{&quot;t&quot;:3.3,&quot;v&quot;:0.13},{&quot;t&quot;:3.6,&quot;v&quot;:0.3},{&quot;t&quot;:5.35,&quot;v&quot;:0.3},{&quot;t&quot;:5.6,&quot;v&quot;:0.13},{&quot;t&quot;:10.6,&quot;v&quot;:0.13},{&quot;t&quot;:10.9,&quot;v&quot;:0.28},{&quot;t&quot;:11.55,&quot;v&quot;:0.28},{&quot;t&quot;:11.8,&quot;v&quot;:0.13},{&quot;t&quot;:15.85,&quot;v&quot;:0.13},{&quot;t&quot;:16.15,&quot;v&quot;:0.28},{&quot;t&quot;:20.35,&quot;v&quot;:0.28},{&quot;t&quot;:20.6,&quot;v&quot;:0.13},{&quot;t&quot;:23.5,&quot;v&quot;:0.13},{&quot;t&quot;:23.8,&quot;v&quot;:0.28},{&quot;t&quot;:27.65,&quot;v&quot;:0.28},{&quot;t&quot;:27.9,&quot;v&quot;:0.13},{&quot;t&quot;:30.6,&quot;v&quot;:0.13},{&quot;t&quot;:30.9,&quot;v&quot;:0.28},{&quot;t&quot;:35.2,&quot;v&quot;:0.28},{&quot;t&quot;:35.5,&quot;v&quot;:0.06},{&quot;t&quot;:42.8,&quot;v&quot;:0.06},{&quot;t&quot;:43.15,&quot;v&quot;:0.13},{&quot;t&quot;:54.0,&quot;v&quot;:0.13},{&quot;t&quot;:54.3,&quot;v&quot;:0.3},{&quot;t&quot;:55.8,&quot;v&quot;:0.3},{&quot;t&quot;:56.0,&quot;v&quot;:0.16},{&quot;t&quot;:58.3,&quot;v&quot;:0.16},{&quot;t&quot;:58.6,&quot;v&quot;:0.36},{&quot;t&quot;:60,&quot;v&quot;:0.36}]}]}"
        src="assets/music/bed.mp3"
      ></audio>

      <!-- Narration (Kokoro af_heart) -->
      <audio id="vo-1" class="clip" data-start="0.8" data-duration="2.41" data-track-index="11" data-volume="1.412538" data-audio-group="voiceover" src="assets/vo/line-1.wav"></audio>
      <audio id="vo-2" class="clip" data-start="5.6" data-duration="4.95" data-track-index="11" data-volume="1.083927" data-audio-group="voiceover" src="assets/vo/line-2.wav"></audio>
      <audio id="vo-3" class="clip" data-start="11.8" data-duration="3.97" data-track-index="11" data-volume="1.566751" data-audio-group="voiceover" src="assets/vo/line-3.wav"></audio>
      <audio id="vo-4" class="clip" data-start="20.6" data-duration="2.82" data-track-index="11" data-volume="1.380384" data-audio-group="voiceover" src="assets/vo/line-4.wav"></audio>
      <audio id="vo-5" class="clip" data-start="27.9" data-duration="2.65" data-track-index="11" data-volume="1.566751" data-audio-group="voiceover" src="assets/vo/line-5.wav"></audio>
      <audio id="vo-6" class="clip" data-start="43.4" data-duration="3.5" data-track-index="11" data-volume="1.513561" data-audio-group="voiceover" src="assets/vo/line-6.wav"></audio>
      <audio id="vo-7" class="clip" data-start="50.3" data-duration="3.65" data-track-index="11" data-volume="1.462177" data-audio-group="voiceover" src="assets/vo/line-7.wav"></audio>
      <audio id="vo-8" class="clip" data-start="56" data-duration="2.24" data-track-index="11" data-volume="1.603245" data-audio-group="voiceover" src="assets/vo/line-8.wav"></audio>

      <!-- The cloned voices themselves: real Homegrown output from local storage. -->
      <audio id="clone-1" class="clip" data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;safe&quot;,&quot;label&quot;:&quot;Peak safety&quot;,&quot;params&quot;:{&quot;limit&quot;:-1}}]}" data-start="35.5" data-duration="7.25" data-media-start="0" data-track-index="12" data-volume="2.483133" data-fade-out="0.2" data-audio-group="clones" src="assets/audio/cloned-voice-1.mp3"></audio>
      <audio id="clone-2" class="clip" data-start="47.15" data-duration="2.55" data-media-start="0" data-track-index="12" data-volume="3.981072" data-fade-out="0.15" data-audio-group="clones" src="assets/audio/cloned-voice-2.mp3"></audio>

      <!-- SFX: sparse, never on spoken words. -->
      <audio id="sfx-strike" class="clip" data-start="3.55" data-duration="1.48" data-track-index="13" data-volume="0.45" data-audio-group="sfx" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
      <audio id="sfx-wordmark" class="clip" data-start="5.35" data-duration="0.14" data-track-index="14" data-volume="0.4" data-audio-group="sfx" src="assets/sfx/impactSoft_medium_002.ogg"></audio>
      <audio id="sfx-ch1" class="clip" data-start="10.95" data-duration="0.12" data-track-index="13" data-volume="0.3" data-audio-group="sfx" src="assets/sfx/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-ch2" class="clip" data-start="19.95" data-duration="0.12" data-track-index="13" data-volume="0.3" data-audio-group="sfx" src="assets/sfx/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-generate" class="clip" data-start="24.8" data-duration="0.06" data-track-index="14" data-volume="0.55" data-audio-group="sfx" src="assets/sfx/mouseclick1.ogg"></audio>
      <audio id="sfx-ch3" class="clip" data-start="26.95" data-duration="0.12" data-track-index="13" data-volume="0.3" data-audio-group="sfx" src="assets/sfx/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-ch4" class="clip" data-start="33.95" data-duration="0.12" data-track-index="13" data-volume="0.3" data-audio-group="sfx" src="assets/sfx/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-ch5" class="clip" data-start="42.95" data-duration="0.12" data-track-index="13" data-volume="0.3" data-audio-group="sfx" src="assets/sfx/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-ch6" class="clip" data-start="49.85" data-duration="0.12" data-track-index="13" data-volume="0.3" data-audio-group="sfx" src="assets/sfx/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-outro" class="clip" data-start="55.6" data-duration="0.65" data-track-index="14" data-volume="0.5" data-audio-group="sfx" src="assets/sfx/impactBell_heavy_003.ogg"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
